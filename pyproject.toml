[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c2b"
version = "0.28.0"
description = "C2B (CAD to BIM): extract structural elements from client DXF drawings into a canonical JSON schema, an Excel review workbook, a review DXF and a diagnostics report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ComputerHelp BIM" }]
dependencies = [
    "ezdxf>=1.3,<2",
    "shapely>=2.0,<3",
    "pydantic>=2.5,<3",
    "openpyxl>=3.1,<4",
    "typer>=0.12",
    "pyyaml>=6.0",
    # The branded WPF windows. Windows only -- everywhere else C2B falls back to Tkinter,
    # and the marker keeps a Linux or macOS install from failing on a package that cannot
    # build there. Without this the whole tool runs in the plain window and nothing says why.
    "pythonnet>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
render = ["matplotlib>=3.8"]

[project.scripts]
c2b = "c2b.cli:app"

[project.gui-scripts]
c2b-gui = "c2b.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # long lines: this code reads better with a wide window than with wrapped geometry
    "B008",    # typer states its CLI options in the defaults; that is the framework's own idiom
    "B905",    # zip(strict=) would change behaviour on ragged input, not just style
    "E741",    # "l" is a line and "o" an offset in the geometry code, and reads better than a word
    "RUF001",  # the prose uses real dashes and arrows
    "UP045",   # Optional[...] is what typer reads for CLI arguments
    "SIM108",  # an if/else whose branches carry a comment each beats a ternary wrapped over two lines
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B023"]
