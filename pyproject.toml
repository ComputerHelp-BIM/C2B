[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c2b"
version = "0.12.1"
description = "C2B (CAD to BIM): extract structural elements from client DXF drawings into a canonical JSON schema, an Excel review workbook, a review DXF and a diagnostics report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ComputerHelp BIM" }]
dependencies = [
    "ezdxf>=1.3,<2",
    "shapely>=2.0,<3",
    "pydantic>=2.5,<3",
    "openpyxl>=3.1,<4",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
render = ["matplotlib>=3.8"]

[project.scripts]
c2b = "c2b.cli:app"

[project.gui-scripts]
c2b-gui = "c2b.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
